services:
  - type: web
    name: boaforma-backend
    env: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.academia.com
      - key: TRUSTED_HOSTS
        value: api.academia.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  - type: web
    name: boaforma-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.academia.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
